version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the Apache.Ignite package id also has the client of Ignite 3 (3.x), another product than Ignite 2
      - dependency-name: Apache.Ignite*
        update-types: [ "version-update:semver-major" ]
    groups:
      # released together: the Ignite packages and the Java modules of JavaLibs.props move as one (the Ignite Upgrade
      # workflow updates the modules)
      apache-ignite:
        patterns:
          - Apache.Ignite*
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
      tests:
        patterns:
          - Microsoft.NET.Test.Sdk
          - Testcontainers*
          - xunit*
          - Xunit.*

  # the base images of the Dockerfile (pinned by digest), in one pull request
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
