name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    permissions:
      contents: read # to checkout codebase

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Dependencies
        run: dotnet restore AspNetCore.Ignite.slnx

      - name: Build
        run: dotnet build AspNetCore.Ignite.slnx -c Release --no-restore

      - name: Test
        # integration tests need a running Ignite server
        run: dotnet test AspNetCore.Ignite.slnx -c Release --no-build --filter "TestCategory!=Integration"
