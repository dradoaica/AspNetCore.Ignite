name: Release

# a published GitHub release (tag e.g. 2.19.0): tests once, then the NuGet package and the server image, both versioned
# by the tag
on:
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACK_PROJECT: src/AspNetCore.Ignite/AspNetCore.Ignite.csproj

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # GHCR requires lowercase names
      - id: image
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "image=ghcr.io/${owner,,}/${repo,,}-server" >> "$GITHUB_OUTPUT"

  packages:
    needs: [tests, version]
    permissions:
      contents: read # to checkout codebase
      packages: write # to push NuGet packages to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack NuGet Packages
        run: >-
          dotnet pack "${{ env.PACK_PROJECT }}" -c Release -o artifacts/package/release
          -p:Version="${{ needs.version.outputs.version }}"

      # the .nupkg and its symbols (.snupkg)
      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/package/release/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

  # each platform is built natively (no emulation) and pushed by digest; the manifest job tags the multi-platform image
  image:
    needs: [tests, version]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # checkout repository
      packages: write # to push the image to GHCR
      actions: write # for BuildKit GHA cache
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}

      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # SBOM and provenance attestations attached to the image
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export Digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image-manifest:
    needs: [image, version]
    permissions:
      contents: read
      packages: write # to push the image index to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Create and Push the Multi-Platform Image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.version.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}"

  # opens a pull request on dradoaica/helm-charts that moves the chart to the released image; needs a HELM_CHARTS_TOKEN
  # secret (a token that can push branches and open pull requests there), and is skipped without it
  chart:
    needs: [image-manifest, version]
    runs-on: ubuntu-latest
    env:
      HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}
    steps:
      - name: Skip without HELM_CHARTS_TOKEN
        if: env.HELM_CHARTS_TOKEN == ''
        run: echo "::notice::HELM_CHARTS_TOKEN is not set; update appVersion of the aspnetcore-ignite-server chart by hand."

      - name: Checkout Helm Chart
        if: env.HELM_CHARTS_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: dradoaica/helm-charts
          token: ${{ secrets.HELM_CHARTS_TOKEN }}
          path: helm-charts

      - name: Open Pull Request
        if: env.HELM_CHARTS_TOKEN != ''
        working-directory: helm-charts
        env:
          GH_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          chart=charts/aspnetcore-ignite-server/Chart.yaml
          branch="aspnetcore-ignite-server-${VERSION}"
          # appVersion follows the image; the chart version gets a patch bump
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$chart"
          current="$(sed -n -E 's/^version: (.*)/\1/p' "$chart")"
          sed -i -E "s/^version: .*/version: ${current%.*}.$(( ${current##*.} + 1 ))/" "$chart"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "aspnetcore-ignite-server: appVersion ${VERSION}"
          git push origin "$branch"
          gh pr create --title "aspnetcore-ignite-server: appVersion ${VERSION}" \
            --body "Moves the chart to the ${VERSION} image released by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ github.event.release.tag_name }}."

