name: Release

# a published GitHub release (tag e.g. 2.19.0): tests once, then the NuGet package and the server image, both versioned
# by the tag; run by hand, a dry run that builds them both (for every platform) and publishes nothing
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (the dry run publishes nothing)
        type: string
        default: 0.0.0-dryrun

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACK_PROJECT: src/AspNetCore.Ignite/AspNetCore.Ignite.csproj

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      ignite: ${{ steps.ignite.outputs.ignite }}
      latest-tag: ${{ steps.tags.outputs.latest }}
      major-tag: ${{ steps.tags.outputs.major }}
      minor-tag: ${{ steps.tags.outputs.minor }}
    steps:
      # The tag (or the input) becomes the version of the package and the image. It must be a version: a tag name may
      # contain e.g. $(...), and the version reaches the commands of jobs that hold the publishing tokens.
      - id: version
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release tag is not a version (e.g., 2.19.0 or 2.19.0-rc.1)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            Directory.Packages.props
            scripts/ci
          sparse-checkout-cone-mode: false

      # latest, <major> and <major>.<minor> move only to the highest release of their line: a patch of an older line
      # (e.g., 2.18.3 after 2.19.0) leaves them where they are, and a pre-release moves none
      - id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          # a release published as a pre-release moves no floating tag, whatever its version
          PRERELEASE: ${{ github.event.release.prerelease == true }}
        run: >-
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000
          --json tagName --jq '.[].tagName' | scripts/ci/release-tags.sh "$VERSION" | tee -a "$GITHUB_OUTPUT"

      # the Apache Ignite version of the image, which the chart records
      - id: ignite
        run: echo "ignite=$(sed -n -E 's/.*<IgniteVersion>([^<]*)<\/IgniteVersion>.*/\1/p' Directory.Packages.props)" >> "$GITHUB_OUTPUT"

      # GHCR requires lowercase names
      - id: image
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "image=ghcr.io/${owner,,}/${repo,,}-server" >> "$GITHUB_OUTPUT"

  packages:
    needs: [ tests, version ]
    permissions:
      contents: read # to checkout codebase
      packages: write # to push NuGet packages to GitHub Packages
    runs-on: ubuntu-24.04
    # whether the secret is set: the secret itself goes only to the step that pushes, not to restore and pack, which
    # run the MSBuild targets of third-party packages
    env:
      HAS_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # nuget.org only: with a second package source, central package management wants a source mapping (NU1507,
      # an error in CI); the push names GitHub Packages and its key itself
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Pack NuGet Packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet pack "$PACK_PROJECT" -c Release -o artifacts/package/release -p:Version="$VERSION"

      # the .nupkg, whose assembly embeds its PDB
      - name: Push to GitHub Packages
        if: github.event_name == 'release'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/package/release/*.nupkg"
          --api-key "$GITHUB_PACKAGES_TOKEN"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      # nuget.org too, with a NUGET_API_KEY secret: installing from GitHub Packages needs a token, even for a public package
      - name: Push to nuget.org
        if: github.event_name == 'release' && env.HAS_NUGET_API_KEY == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/package/release/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # each platform is built natively (no emulation) and pushed by digest; the manifest job tags the multi-platform image
  image:
    needs: [ tests, version ]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read # checkout repository
      packages: write # to push the image to GHCR
      actions: write # for BuildKit GHA cache
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}

      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'release' }}
          # SBOM and provenance attestations attached to the (pushed) image
          sbom: ${{ github.event_name == 'release' }}
          provenance: ${{ github.event_name == 'release' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export Digest
        if: github.event_name == 'release'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload Digest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image-manifest:
    if: github.event_name == 'release'
    needs: [ image, version ]
    permissions:
      contents: read
      packages: write # to push the image index to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}
          # no automatic latest: the version job decides which floating tags this release moves
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.minor-tag == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.major-tag == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest-tag == 'true' }}

      - name: Create and Push the Multi-Platform Image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # opens a pull request on dradoaica/helm-charts that moves the chart to the released image (a patch release): on the
  # chart branch released with the image (release/<version>) if there is one, otherwise main; a chart of another minor
  # version is left to its own release. Needs a HELM_CHARTS_TOKEN secret (a token that can push branches and open pull
  # requests there), and is skipped without it
  chart:
    needs: [ image-manifest, version ]
    runs-on: ubuntu-24.04
    # whether the secret is set; the secret itself goes only to the steps that use it
    env:
      HAS_HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN != '' }}
    steps:
      - name: Skip without HELM_CHARTS_TOKEN
        if: env.HAS_HELM_CHARTS_TOKEN != 'true'
        run: echo "::notice::HELM_CHARTS_TOKEN is not set; update appVersion of the aspnetcore-ignite-server chart by hand."

      - name: Checkout Code
        if: env.HAS_HELM_CHARTS_TOKEN == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Resolve Helm Chart Branch
        id: chart-ref
        if: env.HAS_HELM_CHARTS_TOKEN == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "ref=$(scripts/ci/resolve-chart-ref.sh "" "release/${VERSION}")" >> "$GITHUB_OUTPUT"

      - name: Checkout Helm Chart
        if: env.HAS_HELM_CHARTS_TOKEN == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: dradoaica/helm-charts
          ref: ${{ steps.chart-ref.outputs.ref }}
          token: ${{ secrets.HELM_CHARTS_TOKEN }}
          path: helm-charts

      # appVersion and the recorded Ignite version follow the image; the chart version gets a patch bump
      - name: Update Chart
        id: bump
        if: env.HAS_HELM_CHARTS_TOKEN == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IGNITE_VERSION: ${{ needs.version.outputs.ignite }}
          REF: ${{ steps.chart-ref.outputs.ref }}
        run: |
          set -euo pipefail
          scripts/ci/bump-chart.sh helm-charts/charts/aspnetcore-ignite-server/Chart.yaml "$VERSION" "$IGNITE_VERSION" \
            | tee -a "$GITHUB_OUTPUT"
          case "$(grep -o '^result=.*' "$GITHUB_OUTPUT" | tail -n 1)" in
            result=up-to-date)
              echo "::notice::The chart of ${REF} already has appVersion ${VERSION}: no pull request." ;;
            result=other-minor)
              echo "::warning::The chart of ${REF} is on another minor version: release the chart of ${VERSION%.*} (its release branch) with this image instead." ;;
          esac

      - name: Open Pull Request
        if: env.HAS_HELM_CHARTS_TOKEN == 'true' && steps.bump.outputs.result == 'bumped'
        working-directory: helm-charts
        env:
          GH_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REF: ${{ steps.chart-ref.outputs.ref }}
          NOTES: ${{ steps.bump.outputs.notes }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          branch="aspnetcore-ignite-server-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "aspnetcore-ignite-server: appVersion ${VERSION}"
          git push origin "$branch"
          gh pr create --base "$REF" --title "aspnetcore-ignite-server: appVersion ${VERSION}" \
            --body "Moves the chart to the ${VERSION} image released by ${RELEASE_URL}.${NOTES}"
