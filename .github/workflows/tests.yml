name: Tests

# build, unit tests (with coverage), dependency scan and the integration tests (which build the server image and run
# it with Docker); the release workflow calls this workflow, so nothing is published without passing it
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_call:
    inputs:
      helm-charts-ref:
        description: Branch, tag or commit of dradoaica/helm-charts whose aspnetcore-ignite-server chart is tested (default the branch of the same name if it exists, otherwise main)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      helm-charts-ref:
        description: Branch, tag or commit of dradoaica/helm-charts whose aspnetcore-ignite-server chart is tested (default the branch of the same name if it exists, otherwise main)
        type: string
        default: ""
      upgrade-test:
        description: Also test the upgrade from chart 2.18.2 with its data
        type: boolean
        default: false

# a newer push supersedes a running check of the same branch
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  # the server image, built once for the integration tests and the chart jobs
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Image
        run: |
          docker build -t ghcr.io/dradoaica/aspnetcore.ignite-server:e2e .
          docker save ghcr.io/dradoaica/aspnetcore.ignite-server:e2e -o "${RUNNER_TEMP}/image.tar"

      # the OS packages, the Java runtime and jars, and the .NET dependencies of the image: the vulnerabilities with a fix
      # (high and critical) are listed in the log and the summary, and a critical one fails the build (but those of
      # .trivyignore, each with its reason)
      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dradoaica/aspnetcore.ignite-server:e2e
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: table
          output: trivy.txt

      - name: Scan Summary
        run: |
          cat trivy.txt
          { echo '### Image vulnerabilities with a fix (high, critical)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q -E 'CRITICAL: [1-9]' trivy.txt; then
            echo "::error::The image has critical vulnerabilities with a fix (see the summary)."
            exit 1
          fi

      - name: Upload Image
        uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # the arm64 image, released next to the amd64 one that the other jobs test: built natively, started, stopped
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Image
        run: docker build -t aspnetcore.ignite-server:arm64 .

      - name: Smoke Test
        run: |
          set -euo pipefail
          docker run -d --name node -p 9464:9464 -e IGNITE_USER_PASSWORD=smoke-secret \
            -e DEFAULT_ON_HEAP_MEMORY=512 -e DEFAULT_OFF_HEAP_MEMORY=256 aspnetcore.ignite-server:arm64
          for attempt in $(seq 1 120); do
            curl -sf http://127.0.0.1:9464/health/readiness > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9464/health/readiness
          docker exec node control.sh --state | grep 'Cluster state: ACTIVE'
          docker stop -t 60 node
          test "$(docker inspect -f '{{.State.ExitCode}}' node)" = 0

      - name: Diagnostics
        if: failure()
        run: docker logs node --tail 200 || true

  tests:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # the integration tests use this image instead of building the Dockerfile
      IGNITE_SERVER_IMAGE: ghcr.io/dradoaica/aspnetcore.ignite-server:e2e
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # the Java modules of JavaLibs.props (verified by their SHA-256 on every build)
      - name: Cache Java Modules
        uses: actions/cache@v6
        with:
          path: src/AspNetCore.IgniteServer/obj/javalibs
          key: javalibs-${{ hashFiles('src/AspNetCore.IgniteServer/JavaLibs.props', 'Directory.Packages.props') }}

      - name: Load Image
        uses: actions/download-artifact@v8
        with:
          name: server-image
          path: ${{ runner.temp }}

      - name: Import Image
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      - name: Build
        run: dotnet build AspNetCore.Ignite.slnx -c Release

      - name: Unit Tests
        run: >-
          dotnet test tests/AspNetCore.Ignite.UnitTests -c Release --no-build
          --collect "XPlat Code Coverage" --results-directory coverage

      - name: Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: +AspNetCore.Ignite;+AspNetCore.IgniteServer

      - name: Coverage Summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage-report

      - name: Dependency Scan
        run: ./scripts/check-vulnerable-packages.sh AspNetCore.Ignite.slnx

      # Docker on the hosted runner
      - name: Integration Tests
        run: >-
          dotnet test tests/AspNetCore.Ignite.IntegrationTests -c Release --no-build
          --logger "console;verbosity=normal"

  # the server image with its Helm chart: a 2-node persistent cluster in kind, checked by the chart's probes and helm test
  chart:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/dradoaica/aspnetcore.ignite-server
      RELEASE: ignite
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # the chart branch released together with this branch: the same name in dradoaica/helm-charts if it exists
      - name: Resolve Helm Chart Ref
        id: chart-ref
        env:
          INPUT_REF: ${{ inputs.helm-charts-ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref="$(scripts/ci/resolve-chart-ref.sh "$INPUT_REF" "$BRANCH")"
          echo "Testing the chart of dradoaica/helm-charts@${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout Helm Chart
        uses: actions/checkout@v6
        with:
          repository: dradoaica/helm-charts
          ref: ${{ steps.chart-ref.outputs.ref }}
          path: helm-charts

      # paired release branches must agree: the server version is the chart's appVersion (on main, only a notice)
      - name: Check Paired Versions
        env:
          CHART_REF: ${{ steps.chart-ref.outputs.ref }}
        run: scripts/ci/check-paired-versions.sh helm-charts/charts/aspnetcore-ignite-server "$CHART_REF"

      - name: Load Image
        uses: actions/download-artifact@v8
        with:
          name: server-image
          path: ${{ runner.temp }}

      - name: Import Image
        run: docker load -i "${RUNNER_TEMP}/image.tar"

      # kind comes with the runner image (no download, whose checksum check failed now and then)
      - name: Create kind Cluster
        run: kind create cluster --name e2e --wait 120s

      - name: Load Image
        run: kind load docker-image "$IMAGE:e2e" --name e2e

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # installs a two-node persistent cluster, waits for the probes, runs helm test, and prints diagnostics on failure
      - name: Test Chart
        run: scripts/test-chart.sh helm-charts/charts/aspnetcore-ignite-server
        env:
          KEEP: 1

  # the documented upgrade from chart 2.18.2 (REST probes, one "persistence" volume with the WAL in it): data written
  # before it is read after it. The published 2.17.0 and 2.18.0 images do not start (their -server JVM option), so the
  # old chart runs this image too; on demand
  chart-upgrade:
    if: ${{ inputs.upgrade-test }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/dradoaica/aspnetcore.ignite-server
      RELEASE: ignite
      FULLNAME: ignite-aspnetcore-ignite-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout Old Helm Chart
        uses: actions/checkout@v6
        with:
          repository: dradoaica/helm-charts
          ref: aspnetcore-ignite-server-2.18.2
          path: helm-charts-old

      # the chart branch released together with this branch: the same name in dradoaica/helm-charts if it exists
      - name: Resolve Helm Chart Ref
        id: chart-ref
        env:
          INPUT_REF: ${{ inputs.helm-charts-ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref="$(scripts/ci/resolve-chart-ref.sh "$INPUT_REF" "$BRANCH")"
          echo "Testing the chart of dradoaica/helm-charts@${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout Helm Chart
        uses: actions/checkout@v6
        with:
          repository: dradoaica/helm-charts
          ref: ${{ steps.chart-ref.outputs.ref }}
          path: helm-charts

      - name: Load Image
        uses: actions/download-artifact@v8
        with:
          name: server-image
          path: ${{ runner.temp }}

      # kind comes with the runner image (no download, whose checksum check failed now and then)
      - name: Create kind Cluster
        run: kind create cluster --name upgrade --wait 120s

      - name: Import Images
        run: |
          docker load -i "${RUNNER_TEMP}/image.tar"
          kind load docker-image "$IMAGE:e2e" --name upgrade

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install Chart 2.18.2
        run: >-
          helm install "$RELEASE" helm-charts-old/charts/aspnetcore-ignite-server
          --set image.tag=e2e --set image.pullPolicy=Never --set persistence.size=1Gi
          --set env.REST_ENABLED=true --set env.DEFAULT_ON_HEAP_MEMORY=512 --set env.DEFAULT_OFF_HEAP_MEMORY=256
          --set resources.requests.cpu=500m --set resources.limits.cpu=1
          --set resources.requests.memory=3Gi --set resources.limits.memory=3Gi
          --wait --timeout 10m

      - name: Write Data (REST)
        run: |
          set -euo pipefail
          kubectl run rest --image=curlimages/curl:8.17.0 --restart=Never --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/rest --timeout=120s
          rest() { kubectl exec rest -- curl -sS -G "http://${FULLNAME}:8080/ignite" --data-urlencode ignite.login=ignite --data-urlencode ignite.password=ignite "$@"; }
          rest --data-urlencode cmd=getorcreate --data-urlencode cacheName=upgrade
          rest --data-urlencode cmd=put --data-urlencode cacheName=upgrade --data-urlencode key=k --data-urlencode val=survived | grep -q '"successStatus":0'

      # the documented steps: stop the cluster cleanly (checkpoint), remove the StatefulSet (its spec cannot change), and
      # upgrade with the old volume claim name, so the data volume is reused with the WAL in it
      - name: Upgrade
        run: |
          set -euo pipefail
          kubectl scale statefulset "${FULLNAME}-cluster" --replicas=0
          kubectl wait --for=delete pod -l app.kubernetes.io/name=aspnetcore-ignite-server --timeout=300s
          kubectl delete statefulset "${FULLNAME}-cluster" --cascade=orphan
          helm upgrade "$RELEASE" helm-charts/charts/aspnetcore-ignite-server \
            --set image.tag=e2e --set image.pullPolicy=Never \
            --set persistence.storageVolume.claimName=persistence --set persistence.storageVolume.size=1Gi \
            --set persistence.walVolume.enabled=false --set rest.enabled=true \
            --set resources.requests.cpu=500m --set resources.limits.cpu=1 \
            --set resources.requests.memory=3Gi --set resources.limits.memory=3Gi \
            --set memory.onHeapMB=512 --set memory.offHeapMB=256 --set memory.maxDirectMemorySizeMB=1024 \
            --wait --timeout 10m

      - name: Read Data
        run: |
          set -euo pipefail
          value=$(kubectl exec rest -- curl -sS -G "http://${FULLNAME}:8080/ignite" --data-urlencode ignite.login=ignite \
            --data-urlencode ignite.password=ignite --data-urlencode cmd=get --data-urlencode cacheName=upgrade --data-urlencode key=k)
          echo "$value"
          echo "$value" | grep -q '"response":"survived"'

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,pvc,svc -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=aspnetcore-ignite-server --all-containers --tail=200

