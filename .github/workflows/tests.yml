name: Tests

# build, unit tests (with coverage), dependency scan and the integration tests (which build the server image and run
# it with Docker); the release workflow calls this workflow, so nothing is published without passing it
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_call:
    inputs:
      helm-charts-ref:
        description: Branch, tag or commit of dradoaica/helm-charts whose aspnetcore-ignite-server chart is tested
        type: string
        default: main
  workflow_dispatch:
    inputs:
      helm-charts-ref:
        description: Branch, tag or commit of dradoaica/helm-charts whose aspnetcore-ignite-server chart is tested
        type: string
        default: main

# a newer push supersedes a running check of the same branch
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # the Java modules of JavaLibs.props (verified by their SHA-256 on every build)
      - name: Cache Java Modules
        uses: actions/cache@v4
        with:
          path: src/AspNetCore.IgniteServer/obj/javalibs
          key: javalibs-${{ hashFiles('src/AspNetCore.IgniteServer/JavaLibs.props', 'Directory.Packages.props') }}

      - name: Build
        run: dotnet build AspNetCore.Ignite.slnx -c Release

      - name: Unit Tests
        run: >-
          dotnet test tests/AspNetCore.Ignite.UnitTests -c Release --no-build
          --collect "XPlat Code Coverage" --results-directory coverage

      - name: Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: +AspNetCore.Ignite;+AspNetCore.IgniteServer

      - name: Coverage Summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-report

      - name: Dependency Scan
        run: ./scripts/check-vulnerable-packages.sh AspNetCore.Ignite.slnx

      # Docker on the hosted runner
      - name: Integration Tests
        run: >-
          dotnet test tests/AspNetCore.Ignite.IntegrationTests -c Release --no-build
          --logger "console;verbosity=normal"

  # the server image with its Helm chart: a 2-node persistent cluster in kind, checked by the chart's probes and helm test
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/dradoaica/aspnetcore.ignite-server
      RELEASE: ignite
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout Helm Chart
        uses: actions/checkout@v6
        with:
          repository: dradoaica/helm-charts
          ref: ${{ inputs.helm-charts-ref || 'main' }}
          path: helm-charts

      - name: Build Image
        run: docker build -t "$IMAGE:e2e" .

      - name: Create kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: Load Image
        run: kind load docker-image "$IMAGE:e2e" --name e2e

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install Chart
        run: >-
          helm install "$RELEASE" helm-charts/charts/aspnetcore-ignite-server
          --set image.tag=e2e --set image.pullPolicy=Never
          --set replicaCount=2 --set env.ACTIVATION_MIN_SERVER_NODES=2
          --set authentication.igniteUserPassword=e2e-secret
          --set resources.requests.cpu=500m --set resources.limits.cpu=1
          --set resources.requests.memory=3Gi --set resources.limits.memory=3Gi
          --set memory.onHeapMB=512 --set memory.offHeapMB=256 --set memory.maxDirectMemorySizeMB=1024
          --set persistence.storageVolume.size=1Gi --set persistence.walVolume.size=1Gi
          --wait --timeout 10m

      - name: Helm Test
        run: helm test "$RELEASE" --logs

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,pvc,svc -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=aspnetcore-ignite-server --all-containers --tail=200

